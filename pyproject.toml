[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-mcp"
version = "2026.10.22.02"
description = "MCP tool that lets Claude look at and manage Docker containers, images, volumes, networks and Compose stacks, over SSH."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "drmogie" }]
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
docker-mcp = "docker_mcp:main"

[tool.setuptools]
packages = ["docker_mcp"]
